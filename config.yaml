# Wake-LXC Middleware Configuration
# Proxmox credentials loaded from environment variables (.env)

global:
  stop_minutes: 10
  check_interval: 30

containers:
  - vmid: 105
    kind: lxc
    domain: docmost.sub.domain.name
    stop_minutes: 60
    stop_mode: shutdown
    check_interval: 15
  
  - vmid: 106
    kind: lxc
    domain: n8n.sub.domain.name
    stop_minutes: 120
    stop_mode: shutdown
